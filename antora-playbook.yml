site:
  title: Демо документация
  start_page: crm-leads-api::index.adoc
  url: https://aks0t.github.io/doc-demo

content:
  sources:
    - url: .
      start_path: docs
      branches: HEAD
      edit_url: false

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: build/site

# Kroki-сервер поднимается ЛОКАЛЬНО (см. build.sh) и в CI (см. .github/workflows/publish-docs.yml)
# как сервис-контейнер на localhost:8000 — в обоих случаях используется один и тот же адрес,
# сборка ни разу не ходит в публичный kroki.io. Это устраняет флаки, вызванный сетью/rate-limit'ами.
asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    kroki-server-url: http://localhost:8000
    kroki-fetch-diagram: true
